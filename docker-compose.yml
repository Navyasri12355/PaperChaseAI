version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: arxiv-backend
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/app/.cache

  frontend:
    build: ./frontend
    container_name: arxiv-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
